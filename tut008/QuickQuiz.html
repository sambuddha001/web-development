<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz</title>
</head>
<body>
    <h1>
        A vertically aligned form asking for name, city and pincode of a user without using br tag
    </h1>
    <form action="post">
        <div>
            <label for="name">Enter your name :</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" autofocus>
        </div>
        <div>
            <label for="city">Enter your city name :</label>
            <input type="text" id="city" name="city" placeholder="Enter your city name">
        </div>
        <div>
            <label for="pincode">Enter your pincode :</label>
            <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode">
        </div>
    </form>
</body>
</html>
